services:
  postgres:
    image: postgres:16-alpine
    container_name: orochia-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: orochia_user
      POSTGRES_PASSWORD: orochia_secret
      POSTGRES_DB: orochia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orochia_user -d orochia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
