<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#240718"/>
      <stop offset="35%" stop-color="#18041a"/>
      <stop offset="65%" stop-color="#3b0820"/>
      <stop offset="85%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="b2-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b2-ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180312"/>
      <stop offset="50%" stop-color="#0a0208"/>
      <stop offset="100%" stop-color="#030002"/>
    </linearGradient>
    <linearGradient id="b2-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="b2-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1500" height="340" fill="url(#b2-sky)"/>

  <!-- Giant Synthwave Sun -->
  <circle cx="750" cy="300" r="160" fill="url(#b2-sun)"/>
  <circle cx="750" cy="300" r="110" fill="#fde047" opacity="0.85"/>
