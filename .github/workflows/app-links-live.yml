name: App links (live)

# Universal links / App Links are checked against the deployed site (the files, Apple's CDN, Google's Digital Asset
# Links API): after every push to main (the deploy takes a few minutes, the job retries) and every day.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: dev.orochia.com serves valid app-site-association and assetlinks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Live check (retries while the deploy lands)
        run: |
          for i in $(seq 1 12); do
            node scripts/check-app-links.mjs --live https://dev.orochia.com && exit 0
            sleep 120
          done
          exit 1
