name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + package typecheck)
        run: npm run lint
      - name: Typecheck web app
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Docs are generated from this code
        run: node scripts/generate-docs.mjs --check
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  database:
    name: Migrations & seed on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orochia_user
          POSTGRES_PASSWORD: orochia_secret
          POSTGRES_DB: orochia_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orochia_user:orochia_secret@localhost:5432/orochia_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bundled production migrator
        run: |
          npm run build:migrator -w packages/db
          MIGRATIONS_DIR=packages/db/drizzle node packages/db/dist/migrate.cjs
      - name: Migrations are idempotent
        run: MIGRATIONS_DIR=packages/db/drizzle node packages/db/dist/migrate.cjs
      - name: Development seed loads
        run: npm run db:seed
