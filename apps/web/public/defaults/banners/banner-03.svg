<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b3-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031b2e"/>
      <stop offset="40%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#000408"/>
    </linearGradient>
    <linearGradient id="b3-beam" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b3-wave-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b3-wave-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="b3-glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="1500" height="500" fill="url(#b3-deep)"/>

  <!-- Volumetric Underwater Light Beams -->
  <polygon points="120,0 280,0 480,500 220,500" fill="url(#b3-beam)"/>
  <polygon points="460,0 620,0 860,500 600,500" fill="url(#b3-beam)"/>
  <polygon points="850,0 1020,0 1280,500 1010,500" fill="url(#b3-beam)"/>
  <polygon points="1180,0 1340,0 1560,500 1300,500" fill="url(#b3-beam)"/>

  <!-- Futuristic Underwater Bio-Domes / Coral Spires -->
  <g fill="#010812">
    <!-- Left Bio-Dome -->
    <path d="M-40,500 L-40,380 Q 150,260 340,500 Z"/>
    <!-- Center Spires -->
    <path d="M520,500 L560,340 Q 600,320 640,340 L680,500 Z"/>
    <path d="M640,500 L680,300 Q 720,280 760,300 L800,500 Z"/>
    <!-- Right Bio-Dome Complex -->
    <path d="M1100,500 Q 1320,290 1540,500 Z"/>
  </g>
  <!-- Bio-Dome Wireframe Rings -->
  <ellipse cx="150" cy="420" rx="130" ry="60" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="1320" cy="420" rx="140" ry="65" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Bioluminescent Fluid Currents -->
  <g filter="url(#b3-glow)">
    <path d="M-80,210 C360,110 880,360 1580,180" fill="none" stroke="url(#b3-wave-1)" stroke-width="5" opacity="0.95"/>
    <path d="M-80,260 C420,160 920,400 1580,230" fill="none" stroke="url(#b3-wave-2)" stroke-width="3" opacity="0.85"/>
    <path d="M-80,310 C460,220 960,430 1580,290" fill="none" stroke="url(#b3-wave-1)" stroke-width="2" opacity="0.7"/>
  </g>

