# Orochia — PRODUCTION environment (DigitalOcean App Platform).
# Used to CREATE the app or change its structure only:
#   doctl apps create --spec deploy/digitalocean/app-spec.production.yaml
#   doctl apps update <APP_ID> --spec deploy/digitalocean/app-spec.production.yaml   # ⚠ can blank the SECRETs (no value here): check them afterwards
# Secret values live in the app (Settings → Environment Variables), entered once; pushes to the branch redeploy.
name: orochia
region: tor
# NEXT_PUBLIC_APP_URL = ${APP_URL}, the primary domain once it is active.
domains:
  # DNS stays at the registrar (Porkbun): ALIAS for the apex, CNAME for www, as App Platform shows.
  - domain: orochia.com
    type: PRIMARY
  - domain: www.orochia.com
    type: ALIAS
services:
  - name: web
    github:
      repo: krizaka/orochia
      branch: production
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${orochia-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${orochia-db.CA_CERT}
      - key: BUNNY_STREAM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BUNNY_STREAM_LIBRARY_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_STORIES_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_DRAFTS_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_TOKEN_AUTH_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYOUT_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BUNNY_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PLATFORM_FEE_PERCENTAGE
        scope: RUN_TIME
        value: "10"
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      # The build badge next to the brand (lib/build-info.ts) is hidden in production.
      - key: NEXT_PUBLIC_APP_ENV
        scope: BUILD_TIME
        value: "production"
      - key: COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      - key: STORAGE_DRIVER
        scope: RUN_TIME
        value: "bunny"
      - key: BUNNY_STORAGE_ZONE
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_PULL_ZONE_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_CLIENT_ACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_CLIENT_SUBACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_FORM_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: SEGPAY_MERCHANT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: SEGPAY_PACKAGE_ID
        scope: RUN_TIME
        type: GENERAL
      - key: METRICS_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Sign in with Google / Facebook (offered only when both values of a provider are set).
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: FACEBOOK_APP_ID
        scope: RUN_TIME
        type: GENERAL
      - key: FACEBOOK_APP_SECRET
        scope: RUN_TIME
        type: SECRET
      # E-mail from mg.orochia.com: Resend when set, Mailgun otherwise.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAILGUN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAILGUN_DOMAIN
        scope: RUN_TIME
        value: "mg.orochia.com"
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "Orochia <no-reply@mg.orochia.com>"
      # E-mail templates: read from mail-templates/ in the Bunny Storage zone (npm run mail:templates:push), cached
      # MAIL_TEMPLATES_CACHE_TTL seconds; the templates bundled in the image are the fallback.
      - key: MAIL_TEMPLATES_SOURCE
        scope: RUN_TIME
        value: "bunny"
      - key: COMPLIANCE_ALERT_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STORAGE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CCBILL_SALT
        scope: RUN_TIME
        type: SECRET
      - key: CCBILL_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SEGPAY_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NOWPAYMENTS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NOWPAYMENTS_IPN_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      # Storage quotas (docs/DEPLOYMENT.md, "Storage quotas"): the platform's cap, a creator's default plan, named plans.
      - key: STORAGE_LIMITS
        scope: RUN_TIME
        value: "on"
      - key: QUOTA_PLATFORM_GB
        scope: RUN_TIME
        value: "500"
      - key: QUOTA_ALERT_THRESHOLDS
        scope: RUN_TIME
        value: "80,95"
      - key: QUOTA_CREATOR_DEFAULT_GB
        scope: RUN_TIME
        value: "20"
      - key: QUOTA_CREATOR_DEFAULT_MINUTES
        scope: RUN_TIME
        value: "600"
      - key: QUOTA_PLANS
        scope: RUN_TIME
        value: "pro=100GB/3000min,unlimited=unlimited"
      - key: QUOTA_ADMIN_PLAN
        scope: RUN_TIME
        value: "unlimited"
      - key: QUOTA_UPLOADS_PER_DAY
        scope: RUN_TIME
        value: "50"
      - key: QUOTA_CONCURRENT_UPLOADS
        scope: RUN_TIME
        value: "3"
      - key: QUOTA_RECONCILE_INTERVAL_MINUTES
        scope: RUN_TIME
        value: "360"
      - key: BUNNY_ACCOUNT_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Abuse defences (SECURITY.md): shared rate limits, the client address App Platform sets, the bot challenge.
      # Realtime bus (docs/NOTIFICATIONS.md §3): PostgreSQL LISTEN/NOTIFY up to ~3 instances; beyond, REALTIME_BUS=redis
      # and REDIS_URL (SECRET) of a Managed Caching (Valkey) cluster. Streams end every 5 minutes and resume.
      - key: REALTIME_BUS
        scope: RUN_TIME
        value: "postgres"
      - key: RATE_LIMIT_STORE
        scope: RUN_TIME
        value: "postgres"
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: "do-connecting-ip"
      - key: BOT_CHALLENGE
        scope: RUN_TIME
        value: "required"
      - key: TURNSTILE_SITE_KEY
        scope: RUN_TIME
        type: GENERAL
      - key: TURNSTILE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
    # A payment gateway is offered only when all of its variables are set (packages/payments factory).

jobs:
  # Applies packages/db/drizzle before every release (bundled migrator, same image).
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: krizaka/orochia
      branch: production
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    run_command: node migrate.cjs
    instance_size_slug: basic-xxs
    envs:
      # The default user (owner, ADMIN), created or reactivated after the migrations.
      - key: OROCHIA_OWNER_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_USERNAME
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${orochia-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${orochia-db.CA_CERT}

databases:
  # Managed PostgreSQL 16 cluster, created beforehand (Databases → Create, same region):
  #   doctl databases create orochia-pg --engine pg --version 16 --region tor1 --size db-s-1vcpu-1gb
  # then create the database and user below in it.
  - name: orochia-db
    engine: PG
    version: "16"
    production: true
    cluster_name: orochia-pg
    db_name: orochia_db
    db_user: orochia_user
