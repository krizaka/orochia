      <stop offset="0%" stop-color="#1e1003"/>
      <stop offset="45%" stop-color="#120801"/>
      <stop offset="100%" stop-color="#050200"/>
    </linearGradient>
    <radialGradient id="b5-sunburst" cx="50%" cy="40%" r="60%">
