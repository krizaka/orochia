<rect width="400" height="400" fill="url(#sheen)"/>
<g opacity="0.9"><path d="M200 110 C270 150 270 250 200 290 C130 250 130 150 200 110 Z" fill="none" stroke="url(#gloss)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 130 L200 280" fill="none" stroke="url(#gloss)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/></g>
