<h1 style="margin:0 0 16px;font-family:'Outfit',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#09090b;">Confirm your address</h1>
<p style="margin:0 0 16px;">Hi @{username},</p>
<p style="margin:0 0 16px;">Confirm your e-mail address to start using Orochia.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td bgcolor="#a21caf" style="background-color:#a21caf;border-radius:999px;">
      <a href="{link}" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;">Confirm my address</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px;">The link works once, for 48 hours. If you did not create an account, ignore this message.</p>
<p style="margin:0;font-size:13px;line-height:1.6;color:#71717a;">If the button does not open, paste this link in your browser:<br><a href="{link}" style="color:#a21caf;word-break:break-all;">{link}</a></p>
