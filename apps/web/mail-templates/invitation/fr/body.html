<h1 style="margin:0 0 16px;font-family:'Outfit',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#09090b;">Vous êtes invité</h1>
<p style="margin:0 0 16px;">Bonjour,</p>
