<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none" role="img" aria-label="Orochia">
  <title>Orochia</title>
  <style>
    .spin { transform-origin: 180px 180px; animation: spin 30s linear infinite; }
    .slither { animation: slither 2.4s linear infinite; }
    .pulse { transform-box: view-box; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slither { to { stroke-dashoffset: -64; } }
    @keyframes pulse { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .spin, .slither, .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="70" y1="290" x2="290" y2="70">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#d946ef"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity=".18"/><stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(20 20)">
    <circle cx="180" cy="180" r="170" fill="url(#glow)"/>
    <circle class="spin" cx="180" cy="180" r="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="8 8" opacity=".6"/>
    <circle cx="180" cy="180" r="134" stroke="#8b949e" stroke-width="1" opacity=".35"/>
    <path d="M259.8,142.8 A88,88 0 1 1 142.8,100.2" stroke="url(#body)" stroke-width="22" stroke-linecap="round"/>
    <path class="slither" d="M259.8,142.8 A88,88 0 1 1 142.8,100.2" stroke="#fdf4ff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>
    <path d="M142.8,100.2 A88,88 0 0 1 187.7,92.3" stroke="url(#body)" stroke-width="14" stroke-linecap="round"/>
    <path d="M187.7,92.3 A88,88 0 0 1 221.3,102.3" stroke="url(#body)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="253.9" cy="130.1" rx="13" ry="20" transform="rotate(-25 253.9 130.1)" fill="url(#body)"/>
    <path d="M245.4,112.0 L242.0,104.8 L235.0,101.5 M242.0,104.8 L244.0,97.3" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <circle class="pulse" cx="256.3" cy="123.5" r="4.5" fill="#fdf4ff"/>
    <path class="pulse" transform="translate(127 120) scale(4.4)" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="url(#flame)"/>
  </g>
</svg>
