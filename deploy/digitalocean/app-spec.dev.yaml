# Orochia — DEV environment (DigitalOcean App Platform).
# Used to CREATE the app or change its structure only:
#   doctl apps create --spec deploy/digitalocean/app-spec.dev.yaml
#   doctl apps update <APP_ID> --spec deploy/digitalocean/app-spec.dev.yaml   # ⚠ can blank the SECRETs (no value here): check them afterwards
# Secret values live in the app (Settings → Environment Variables), entered once; pushes to the branch redeploy.
name: orochia-dev
region: tor
# NEXT_PUBLIC_APP_URL = ${APP_URL}, the primary domain once it is active.
domains:
  # DNS stays at the registrar (Porkbun): add the CNAME App Platform shows for this name.
  - domain: dev.orochia.com
    type: PRIMARY
services:
  - name: web
    github:
      repo: krizaka/orochia
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      # Only production is indexed: dev answers noindex everywhere and robots.txt disallows all.
      - key: SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "off"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${orochia-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${orochia-db.CA_CERT}
      - key: BUNNY_STREAM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BUNNY_STREAM_LIBRARY_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_STORIES_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_DRAFTS_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STREAM_TOKEN_AUTH_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BUNNY_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # Credits settle in-house; until the wallet exists every credits payment is approved (dev only).
      - key: PAYMENTS_CREDITS_MODE
        scope: RUN_TIME
        value: always-approve
      - key: PLATFORM_FEE_PERCENTAGE
        scope: RUN_TIME
        value: "10"
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: STORAGE_DRIVER
        scope: RUN_TIME
        value: "bunny"
      - key: BUNNY_STORAGE_ZONE
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_PULL_ZONE_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_CLIENT_ACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_CLIENT_SUBACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: CCBILL_FORM_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: SEGPAY_MERCHANT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: SEGPAY_PACKAGE_ID
        scope: RUN_TIME
        type: GENERAL
      - key: METRICS_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Sign in with Google / Facebook (offered only when both values of a provider are set).
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: FACEBOOK_APP_ID
        scope: RUN_TIME
        type: GENERAL
      - key: FACEBOOK_APP_SECRET
        scope: RUN_TIME
        type: SECRET
      # E-mail from mg.orochia.com: Resend when set, Mailgun otherwise.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAILGUN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAILGUN_DOMAIN
        scope: RUN_TIME
        value: "mg.orochia.com"
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "Orochia <no-reply@mg.orochia.com>"
      - key: COMPLIANCE_ALERT_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: BUNNY_STORAGE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CCBILL_SALT
        scope: RUN_TIME
        type: SECRET
      - key: CCBILL_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SEGPAY_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NOWPAYMENTS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NOWPAYMENTS_IPN_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
    # A payment gateway is offered only when all of its variables are set (packages/payments factory).

jobs:
  # Applies packages/db/drizzle before every release (bundled migrator, same image).
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: krizaka/orochia
      branch: main
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    run_command: node migrate.cjs
    instance_size_slug: basic-xxs
    envs:
      # The default user (owner, ADMIN), created or reactivated after the migrations.
      - key: OROCHIA_OWNER_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_USERNAME
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: OROCHIA_OWNER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${orochia-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${orochia-db.CA_CERT}

databases:
  # App Platform dev database (PostgreSQL only, not for production data).
  - name: orochia-db
    engine: PG
    version: "16"
    production: false
