<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b6-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140624"/>
      <stop offset="45%" stop-color="#0a0314"/>
      <stop offset="100%" stop-color="#030108"/>
    </linearGradient>
    <linearGradient id="b6-holo-laser-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b6-holo-laser-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0"/>
      <stop offset="35%" stop-color="#eab308" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="b6-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Noir Base -->
  <rect width="1500" height="500" fill="url(#b6-bg)"/>

  <!-- Perspective 3D Cyber Wireframe Grid (Horizon) -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.35">
    <!-- Horizontal receding lines -->
    <line x1="0" y1="360" x2="1500" y2="360"/>
    <line x1="0" y1="385" x2="1500" y2="385"/>
    <line x1="0" y1="415" x2="1500" y2="415"/>
    <line x1="0" y1="450" x2="1500" y2="450"/>
    <line x1="0" y1="490" x2="1500" y2="490"/>
    <!-- Perspective rays radiating from vanishing point (750, 340) -->
    <line x1="750" y1="340" x2="-200" y2="500"/>
    <line x1="750" y1="340" x2="50" y2="500"/>
    <line x1="750" y1="340" x2="300" y2="500"/>
    <line x1="750" y1="340" x2="550" y2="500"/>
    <line x1="750" y1="340" x2="950" y2="500"/>
    <line x1="750" y1="340" x2="1200" y2="500"/>
    <line x1="750" y1="340" x2="1450" y2="500"/>
    <line x1="750" y1="340" x2="1700" y2="500"/>
  </g>

  <!-- Holographic Prism Waveforms -->
  <g filter="url(#b6-glow)">
    <path d="M-60,190 C360,70 820,320 1560,140" fill="none" stroke="url(#b6-holo-laser-1)" stroke-width="4.5" opacity="0.95"/>
    <path d="M-60,240 C420,120 880,360 1560,190" fill="none" stroke="url(#b6-holo-laser-2)" stroke-width="3.5" opacity="0.9"/>
    <path d="M-60,290 C460,180 940,390 1560,240" fill="none" stroke="url(#b6-holo-laser-1)" stroke-width="2" opacity="0.8"/>
  </g>

