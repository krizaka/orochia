# Orochia — DEV environment (DigitalOcean App Platform).
# Used to CREATE the app or change its structure only:
#   doctl apps create --spec deploy/digitalocean/app-spec.dev.yaml
#   doctl apps update <APP_ID> --spec deploy/digitalocean/app-spec.dev.yaml   # ⚠ can blank the SECRETs (no value here): check them afterwards
# Secret values live in the app (Settings → Environment Variables), entered once; pushes to the branch redeploy.
name: orochia-dev
region: tor
# NEXT_PUBLIC_APP_URL = ${APP_URL}, the primary domain once it is active (www.orochia.com since epic krizaka/.github#119).
domains:
  # DNS stays at the registrar (Porkbun): www = CNAME and the apex = ALIAS to this app's host.
  - domain: www.orochia.com
    type: PRIMARY
  - domain: orochia.com
    type: ALIAS
  # The development address: every page goes to www (308); the API (mobile app, webhooks), /.well-known and the native
  # bot-challenge page keep serving (APP_DEV_HOST, apps/web/lib/dev-host.ts).
  - domain: dev.orochia.com
    type: ALIAS
  # The operator console (app/console) is served by this same app on admin.<domain>: the proxy rewrites that host into
  # /console behind AUTH_ALLOWED_IPS, and /console is a 404 on every other host (apps/web/console/lib/gate.ts).
  - domain: admin.orochia.com
    type: ALIAS
# The apex leads to www (308); every other host is the app's.
ingress:
  rules:
    - match:
        authority:
          exact: orochia.com
      redirect:
        authority: www.orochia.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: krizaka/orochia
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      # Only production is indexed: dev answers noindex everywhere and robots.txt disallows all.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "off"
      - key: APP_DEV_HOST
        scope: RUN_TIME
        value: dev.orochia.com
      - key: APP_PUBLIC_ACTIONS
        scope: RUN_TIME
        value: "off"
      # A profile cover that moves (a 3-6 s moment of the creator's own video, orochia#284): on for the dev site only.
      - key: APP_VIDEO_BANNER
        scope: RUN_TIME
        value: "on"
      # The Stream library burns the Orochia watermark into videos encoded from this date (scripts/bunny-library.mjs --watermark on):
      # those videos get no second mark from the player (lib/watermark.ts). Unset it with `--watermark off`.
      - key: MEDIA_WATERMARK_SINCE
        scope: RUN_TIME
        value: "2026-10-19T21:20:00Z"
      # Factory reset from the admin console (backup first). Never honoured on the indexed production.
      - key: DATABASE_ALLOW_RESET
        scope: RUN_TIME
        value: "true"
      # Universal links / App Links (/.well-known/apple-app-site-association and assetlinks.json): entered once in the app.
      - key: APP_IOS_TEAM_ID
        scope: RUN_TIME
        type: GENERAL
      - key: APP_ANDROID_CERT_SHA256
        scope: RUN_TIME
        type: GENERAL
      # The operator console, served on admin.orochia.com by this app (it was the app orochia-admin-dev). Its service
      # token, then its own database (account, sessions, operator log), its single operator, and the address list.
      - key: OPERATOR_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: OPERATOR_API_URL
        scope: RUN_TIME
        value: https://dev.orochia.com
      - key: NEXT_PUBLIC_OPERATOR_PLATFORM_URL
        scope: RUN_AND_BUILD_TIME
        value: https://dev.orochia.com
      - key: DATABASE_CONSOLE_URL
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_OPERATOR_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OPERATOR_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OPERATOR_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Only these client addresses (do-connecting-ip) reach admin.orochia.com, sign-in included. Empty: nobody.
      - key: AUTH_ALLOWED_IPS
        scope: RUN_TIME
        type: GENERAL
      # The owner, restored after a factory reset (same values as the migrate job).
      - key: AUTH_OWNER_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_USERNAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${krizaka-pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${krizaka-pg.CA_CERT}
      # One pool per instance (2 in dev: krizaka-dev-pg has 22 usable slots, budget in the orazaka repo docs/DEV_DATABASE.md). (instances + 1 during a rolling deploy) × (this + 1 LISTEN) + migrate + admin
      # ≤ 70 % of the database's usable slots (~22 on the small plans) — docs/DEPLOYMENT.md, "Database connections".
      - key: DATABASE_MAX_CONNECTIONS
        scope: RUN_TIME
        value: "2"
      - key: MEDIA_STREAM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MEDIA_STREAM_LIBRARY_ID
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STREAM_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STREAM_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STREAM_STORIES_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STREAM_DRAFTS_COLLECTION_ID
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STREAM_TOKEN_AUTH_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_PAYOUT_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MEDIA_STREAM_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # Sign-up is closed on dev while Orochia is in development (403 signup_disabled; existing accounts sign in).
      - key: AUTH_SIGNUP_ENABLED
        scope: RUN_TIME
        value: "false"
      # Credits settle in-house; until the wallet exists every credits payment is approved (dev only).
      - key: PAYMENTS_CREDITS_MODE
        scope: RUN_TIME
        value: test
      - key: PAYMENTS_PLATFORM_FEE_PERCENTAGE
        scope: RUN_TIME
        value: "10"
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      # The build badge next to the brand (lib/build-info.ts): "v<version> · dev · <commit>" — never shown in production.
      - key: NEXT_PUBLIC_APP_ENV
        scope: BUILD_TIME
        value: "dev"
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # The direct (unpooled) connection, for LISTEN/NOTIFY.
      - key: DATABASE_DIRECT_URL
        scope: RUN_TIME
        value: ${krizaka-pg.DATABASE_URL}
      - key: MEDIA_STORAGE_ENDPOINT
        scope: RUN_TIME
        value: storage.bunnycdn.com
      - key: MEDIA_STORAGE_PROVIDER
        scope: RUN_TIME
        value: "bunny"
      - key: MEDIA_STORAGE_ZONE
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_CDN_HOSTNAME
        scope: RUN_TIME
        type: GENERAL
      - key: PAYMENTS_CCBILL_CLIENT_ACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: PAYMENTS_CCBILL_CLIENT_SUBACCOUNT
        scope: RUN_TIME
        type: GENERAL
      - key: PAYMENTS_CCBILL_FORM_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: PAYMENTS_SEGPAY_MERCHANT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: PAYMENTS_SEGPAY_PACKAGE_ID
        scope: RUN_TIME
        type: GENERAL
      - key: OBSERVABILITY_METRICS_TOKEN
        scope: RUN_TIME
        type: SECRET
      # The Explorer runs on Orazaka's dev edge; the key (scoped ai:embed reco:sync reco:read) is a SECRET set with `doctl apps update`.
      - key: AI_ENGINE_URL
        scope: RUN_TIME
        value: https://dev.orazaka.com/edge
      - key: AI_ENGINE_API_KEY
        scope: RUN_TIME
        type: SECRET
      # The recommender's pseudonym key (ADR-078): a SECRET; rotating it forgets every profile at Orazaka.
      - key: AI_PSEUDONYM_KEY
        scope: RUN_TIME
        type: SECRET
      # Sign in with Google / Facebook (offered only when both values of a provider are set).
      - key: AUTH_GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_FACEBOOK_APP_ID
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_FACEBOOK_APP_SECRET
        scope: RUN_TIME
        type: SECRET
      # E-mail from mg.orochia.com through MAIL_PROVIDER (resend | mailgun) and its MAIL_API_KEY.
      - key: MAIL_PROVIDER
        scope: RUN_TIME
        value: "resend"
      - key: MAIL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_DOMAIN
        scope: RUN_TIME
        value: "mg.orochia.com"
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "Orochia <no-reply@mg.orochia.com>"
      # E-mail templates: read from mail-templates/ in the Bunny Storage zone (npm run mail:templates:push), cached
      # MAIL_TEMPLATES_CACHE_TTL seconds; the templates bundled in the image are the fallback.
      - key: MAIL_TEMPLATES_SOURCE
        scope: RUN_TIME
        value: "bunny"
      - key: MAIL_COMPLIANCE_ALERT_TO
        scope: RUN_TIME
        type: GENERAL
      - key: MEDIA_STORAGE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_CCBILL_SALT
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_CCBILL_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_SEGPAY_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_NOWPAYMENTS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_NOWPAYMENTS_IPN_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENTS_STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      # Storage quotas (docs/DEPLOYMENT.md, "Storage quotas"): the platform's cap, a creator's default plan, named plans.
      - key: ABUSE_QUOTAS
        scope: RUN_TIME
        value: "on"
      - key: ABUSE_QUOTA_PLATFORM_GB
        scope: RUN_TIME
        value: "50"
      - key: ABUSE_QUOTA_ALERT_THRESHOLDS
        scope: RUN_TIME
        value: "80,95"
      - key: ABUSE_QUOTA_CREATOR_DEFAULT_GB
        scope: RUN_TIME
        value: "5"
      - key: ABUSE_QUOTA_CREATOR_DEFAULT_MINUTES
        scope: RUN_TIME
        value: "600"
      - key: ABUSE_QUOTA_PLANS
        scope: RUN_TIME
        value: "pro=100GB/3000min,unlimited=unlimited"
      - key: ABUSE_QUOTA_ADMIN_PLAN
        scope: RUN_TIME
        value: "unlimited"
      - key: ABUSE_QUOTA_UPLOADS_PER_DAY
        scope: RUN_TIME
        value: "50"
      - key: ABUSE_QUOTA_CONCURRENT_UPLOADS
        scope: RUN_TIME
        value: "3"
      - key: ABUSE_QUOTA_RECONCILE_INTERVAL_MINUTES
        scope: RUN_TIME
        value: "360"
      - key: MEDIA_ACCOUNT_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Abuse defences (SECURITY.md): shared rate limits, the client address App Platform sets, the bot challenge.
      # Realtime bus (docs/NOTIFICATIONS.md §3): PostgreSQL LISTEN/NOTIFY up to ~3 instances; beyond, REALTIME_BUS=redis
      # and REALTIME_REDIS_URL (SECRET) of a Managed Caching (Valkey) cluster. Streams end every 5 minutes and resume.
      - key: REALTIME_BUS
        scope: RUN_TIME
        value: "postgres"
      - key: ABUSE_RATE_LIMIT_STORE
        scope: RUN_TIME
        value: "postgres"
      - key: ABUSE_CLIENT_IP_HEADER
        scope: RUN_TIME
        value: "do-connecting-ip"
      - key: ABUSE_BOT_CHALLENGE
        scope: RUN_TIME
        value: "auto"
      - key: ABUSE_BOT_CHALLENGE_SITE_KEY
        scope: RUN_TIME
        type: GENERAL
      - key: ABUSE_BOT_CHALLENGE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
    # A payment gateway is offered only when all of its variables are set (packages/payments factory).

jobs:
  # Applies packages/db/drizzle before every release (bundled migrator, same image).
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: krizaka/orochia
      branch: main
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    run_command: node migrate.cjs
    instance_size_slug: basic-xxs
    envs:
      # A squashed migration history (new baseline) rebuilds this development database instead of failing the release.
      - key: DATABASE_ALLOW_RESET
        scope: RUN_TIME
        value: "true"
      - key: APP_SEARCH_INDEXING
        scope: RUN_TIME
        value: "off"
      - key: APP_PUBLIC_ACTIONS
        scope: RUN_TIME
        value: "off"
      # The default user (owner, ADMIN), created or reactivated after the migrations.
      - key: AUTH_OWNER_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_USERNAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OWNER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${krizaka-pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${krizaka-pg.CA_CERT}

databases:
  # The shared dev cluster (krizaka-dev-pg), database and role orochia_db, attached to the app.
  - name: krizaka-pg
    engine: PG
    version: "18"
    production: true
    cluster_name: krizaka-dev-pg
    db_name: orochia_db
    db_user: orochia_db
