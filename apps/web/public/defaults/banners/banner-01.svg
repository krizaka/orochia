    <!-- Deep silk ribbons -->
    <path d="M-80,240 C350,110 820,380 1580,180" fill="none" stroke="url(#b1-ribbon-1)" stroke-width="26" opacity="0.35"/>
    <path d="M-80,280 C400,160 880,410 1580,220" fill="none" stroke="url(#b1-ribbon-2)" stroke-width="18" opacity="0.45"/>

    <!-- Brilliant central wave crests -->
